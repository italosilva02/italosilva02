name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: italosilva02
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#F2734A&color_dots=#140F0D,#3B1F14,#8A4A2E,#C1613C,#F2734A
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2734A&color_dots=#140F0D,#3B1F14,#8A4A2E,#C1613C,#F2734A

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
